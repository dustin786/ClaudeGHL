version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./assets:/app/assets:ro
      - upload_tmp:/tmp/uploads
      - processed_videos:/tmp/processed
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  upload_tmp:
  processed_videos:
